<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, initial-scale=1.0">
  <title>Aerial Screensaver</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <img id="preload" src="" alt="">
  <div id="fade"></div>
  <div id="loading">
    <div id="loading-spinner">
      <i style="--n: 0"></i>
      <i style="--n: 1"></i>
      <i style="--n: 2"></i>
      <i style="--n: 3"></i>
      <i style="--n: 4"></i>
      <i style="--n: 5"></i>
      <i style="--n: 6"></i>
      <i style="--n: 7"></i>
      <i style="--n: 8"></i>
      <i style="--n: 9"></i>
      <i style="--n: 10"></i>
      <i style="--n: 11"></i>
    </div>
  </div>
  <div id="logview"></div>
  <div id="info">
    <div id="info-label"></div>
    <div id="info-description"></div>
  </div>
  <div id="menu">
    <div id="menu-title">Settings</div>
    <div id="menu-items"></div>
    <div id="menu-hint">BACK to close</div>
  </div>
  <object id="player" type="application/avplayer" style="width:1920px;height:1080px;"></object>
  <script src="$WEBAPIS/webapis/webapis.js"></script>
  <script src="js/local-config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/telemetry.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/player.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/debug.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
