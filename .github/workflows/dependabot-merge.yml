name: dependabot-merge
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
permissions: {}
jobs:
  merge:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.actor.login == 'dependabot[bot]' && startsWith(github.event.workflow_run.head_branch, 'dependabot/') && github.event.workflow_run.head_repository.full_name == github.repository && github.repository_owner == 'jeancarlos'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: merge patch and minor updates
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr="$PR"
          if [ -z "$pr" ]; then echo "no PR attached to this run"; exit 0; fi
          if [ "$(gh pr view "$pr" --json author,baseRefName,isCrossRepository --jq '[.author.login, .baseRefName, .isCrossRepository] | join(" ")')" != "app/dependabot develop false" ]; then echo "PR $pr is not a Dependabot PR into develop"; exit 0; fi
          title=$(gh pr view "$pr" --json title --jq .title)
          from=$(printf '%s' "$title" | sed -nE 's/.* from v?([0-9]+)[^ ]* to v?([0-9]+).*/\1/p')
          to=$(printf '%s' "$title" | sed -nE 's/.* from v?([0-9]+)[^ ]* to v?([0-9]+).*/\2/p')
          if [ -z "$from" ] || [ "$from" != "$to" ]; then
            gh pr comment "$pr" --body "Major or unparsed version bump, merge by hand after reading the changelog."
            exit 0
          fi
          gh pr merge "$pr" --merge --match-head-commit "$SHA"
          gh workflow run ci.yml --ref develop
          gh workflow run security.yml --ref develop
