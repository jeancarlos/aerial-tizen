name: promote
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [develop]
permissions: {}
jobs:
  promote:
    if: github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') && github.repository_owner == 'jeancarlos'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: open the release PR for review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$(gh api "repos/$GH_REPO/branches/develop" --jq .commit.sha)" != "$SHA" ]; then echo "develop moved on, a newer run will promote"; exit 0; fi
          if [ "$(gh api "repos/$GH_REPO/compare/main...$SHA" --jq .ahead_by)" -eq 0 ]; then echo "main is up to date"; exit 0; fi
          for name in test reuse zizmor; do
            if [ "$(gh api "repos/$GH_REPO/commits/$SHA/check-runs?filter=latest&per_page=100" --jq "[.check_runs[] | select(.name == \"$name\" and .conclusion == \"success\")] | length")" -eq 0 ]; then echo "required check $name has not passed on $SHA"; exit 0; fi
          done
          pr=$(gh pr list --base main --head develop --json number --jq '.[0].number')
          if [ -z "$pr" ]; then
            pr=$(gh pr create --base main --head develop --title "Release: $(date -u +%Y-%m-%d) develop to main" --body "CI passed on develop. It merges when you approve." | grep -o '[0-9]*$')
          fi
          gh pr merge "$pr" --auto --merge --match-head-commit "$SHA"
          echo "release PR #$pr merges when you approve it"
