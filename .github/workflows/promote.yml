name: promote
on:
  workflow_run:
    workflows: [ci, security, dco]
    types: [completed]
    branches:
      - develop
      - "release-bump/**"
  workflow_dispatch:
    inputs:
      pull_request:
        description: Merged develop-to-main pull request number
        required: true
        type: number
      merge_sha:
        description: Verified pull request merge commit
        required: true
        type: string
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  pull_request_review:
    types: [submitted, edited, dismissed]
permissions: {}
concurrency:
  group: promote-${{ github.event.workflow_run.head_branch || github.event.pull_request.head.ref || inputs.merge_sha || github.ref_name }}
  cancel-in-progress: false
jobs:
  promote:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') && github.repository_owner == 'jeancarlos'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: bump, promote, and release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CODEOWNER_LOGIN: jeancarlos
          SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          EVENT: ${{ github.event.workflow_run.event }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid workflow head SHA"; exit 1; }
          [[ "$HEAD_BRANCH" == develop || "$HEAD_BRANCH" == release-bump/* ]] || exit 0
          git fetch origin main develop
          if [[ "$HEAD_BRANCH" == release-bump/* ]]; then
            git fetch origin "refs/heads/$HEAD_BRANCH:refs/remotes/origin/$HEAD_BRANCH"
          fi
          cp tools/prepare-promotion-release.js "$RUNNER_TEMP/prepare-promotion-release.js"

          latest_sha="$(git ls-remote origin "refs/heads/$HEAD_BRANCH" | awk 'NR == 1 {print $1}')"
          if [ "$latest_sha" != "$SHA" ]; then echo "branch moved, a newer workflow run will continue"; exit 0; fi

          check_required() {
            local sha="$1" name count
            shift
            for name in "$@"; do
              count="$(gh api "repos/$GH_REPO/commits/$sha/check-runs?filter=latest&per_page=100" --jq "[.check_runs[] | select(.name == \"$name\" and .conclusion == \"success\")] | length")"
              if [ "$count" -eq 0 ]; then echo "required check $name has not passed on $sha"; return 1; fi
            done
          }

          version_at() {
            git show "$1:package.json" | node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(0, "utf8")).version)'
          }

          next_patch() {
            node -e 'const match = process.argv[1].match(/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/); if (!match) process.exit(1); console.log(match[1] + "." + match[2] + "." + (BigInt(match[3]) + 1n))' "$1"
          }

          dispatch_develop_checks() {
            local base="$1"
            gh workflow run ci.yml --ref develop --repo "$GH_REPO"
            gh workflow run security.yml --ref develop --repo "$GH_REPO"
            gh workflow run dco.yml --ref develop --repo "$GH_REPO" --field base="$base"
          }

          if [[ "$HEAD_BRANCH" == release-bump/* ]]; then
            [ "$EVENT" = workflow_dispatch ] || exit 0
            if ! check_required "$SHA" test reuse zizmor dco; then exit 0; fi
            pr="$(gh pr list --state open --base develop --head "$HEAD_BRANCH" --json number --jq '.[0].number')"
            if [ -z "$pr" ]; then
              pr_state="$(gh pr list --state all --base develop --head "$HEAD_BRANCH" --json state --jq '.[0].state // empty')"
              if [ "$pr_state" = MERGED ] || [ "$pr_state" = CLOSED ]; then
                echo "version-bump PR is already closed or merged"
                exit 0
              fi
              echo "version-bump PR is missing" >&2
              exit 1
            fi

            develop_sha="$(git ls-remote origin refs/heads/develop | awk 'NR == 1 {print $1}')"
            [ -n "$develop_sha" ] || { echo "develop branch is missing" >&2; exit 1; }
            bump_parent="$(git rev-parse "$SHA^")"
            base_version="$(version_at "$develop_sha")"
            expected_version="$(next_patch "$base_version")"
            expected_branch="release-bump/v$expected_version-${develop_sha:0:7}"
            [ "$HEAD_BRANCH" = "$expected_branch" ] || { echo "unexpected version-bump branch" >&2; exit 1; }
            if [ "$bump_parent" != "$develop_sha" ] || [ "$(git rev-list --count "$develop_sha..$SHA")" -ne 1 ]; then
              echo "version-bump branch is not a single commit on current develop" >&2
              exit 1
            fi
            [ "$(version_at "$SHA")" = "$expected_version" ] || { echo "version bump is not the next patch" >&2; exit 1; }

            expected_files="$(printf '%s\n' CHANGELOG.md config.xml package-lock.json package.json)"
            changed_files="$(git diff-tree --no-commit-id --name-only -r "$SHA" | LC_ALL=C sort)"
            [ "$changed_files" = "$expected_files" ] || { echo "version-bump PR changes unexpected files" >&2; exit 1; }
            release_dates="$(git show "$SHA:CHANGELOG.md" | sed -nE "s/^## $expected_version - ([0-9]{4}-[0-9]{2}-[0-9]{2})$/\\1/p")"
            [ "$(printf '%s\n' "$release_dates" | wc -l)" -eq 1 ] && [[ "$release_dates" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || {
              echo "version-bump changelog has no unique release date" >&2
              exit 1
            }
            release_date="$release_dates"
            expected_dir="$(mktemp -d "$RUNNER_TEMP/release-bump-expected.XXXXXX")"
            git archive "$develop_sha" | tar -x -C "$expected_dir"
            mkdir -p "$expected_dir/tools"
            cp "$RUNNER_TEMP/prepare-promotion-release.js" "$expected_dir/tools/prepare-promotion-release.js"
            node "$RUNNER_TEMP/prepare-promotion-release.js" "$expected_dir" "$release_date"
            for file in CHANGELOG.md config.xml package-lock.json package.json; do
              if ! git show "$SHA:$file" | cmp -s - "$expected_dir/$file"; then
                rm -rf "$expected_dir"
                echo "version-bump PR does not match generated release metadata" >&2
                exit 1
              fi
            done
            rm -rf "$expected_dir"

            gh pr merge "$pr" --merge --match-head-commit "$SHA"
            main_sha="$(git ls-remote origin refs/heads/main | awk 'NR == 1 {print $1}')"
            dispatch_develop_checks "$main_sha"
            exit 0
          fi

          ahead_by="$(gh api "repos/$GH_REPO/compare/main...$SHA" --jq .ahead_by)"
          if [ "$ahead_by" -eq 0 ]; then echo "main is up to date"; exit 0; fi

          main_version="$(version_at origin/main)"
          develop_version="$(version_at "$SHA")"
          if [ "$develop_version" = "$main_version" ]; then
            if [ "$EVENT" = push ]; then
              if ! check_required "$SHA" test reuse zizmor; then exit 0; fi
            else
              if ! check_required "$SHA" test reuse zizmor dco; then exit 0; fi
            fi

            next_version="$(next_patch "$main_version")"
            bump_branch="release-bump/v$next_version-${SHA:0:7}"
            existing_pr="$(gh pr list --state open --base develop --head "$bump_branch" --json number --jq '.[0].number')"
            if [ -n "$existing_pr" ]; then echo "version-bump PR #$existing_pr is already open"; exit 0; fi
            if git ls-remote --exit-code --heads origin "$bump_branch" >/dev/null 2>&1; then
              echo "release-bump branch exists without an open PR" >&2
              exit 1
            fi

            git checkout -b "$bump_branch" "$SHA"
            node "$RUNNER_TEMP/prepare-promotion-release.js" "$GITHUB_WORKSPACE" "$(date -u +%Y-%m-%d)"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add config.xml package.json package-lock.json CHANGELOG.md
            git commit -s -m "chore: prepare v$next_version release"
            git_auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $git_auth" push origin "$bump_branch"
            unset git_auth
            gh pr create --base develop --head "$bump_branch" --title "Release: v$next_version" --body "Prepare the next patch release during promotion. Required checks run before this PR is merged."
            gh workflow run ci.yml --ref "$bump_branch" --repo "$GH_REPO"
            gh workflow run security.yml --ref "$bump_branch" --repo "$GH_REPO"
            gh workflow run dco.yml --ref "$bump_branch" --repo "$GH_REPO" --field base="$SHA"
            exit 0
          fi

          expected_version="$(next_patch "$main_version")"
          if [ "$develop_version" != "$expected_version" ]; then
            echo "develop version $develop_version is not the next patch after main $main_version" >&2
            exit 1
          fi
          if [ "$EVENT" = push ]; then
            if ! check_required "$SHA" test reuse zizmor; then exit 0; fi
          else
            if ! check_required "$SHA" test reuse zizmor dco; then exit 0; fi
          fi

          pr="$(gh pr list --state open --base main --head develop --json number --jq '.[0].number')"
          if [ -z "$pr" ]; then
            pr="$(gh pr create --base main --head develop --title "Release: $(date -u +%Y-%m-%d) develop to main" --body "CI and security checks passed on develop. This promotion publishes v$develop_version after code-owner approval.")"
            pr="${pr##*/}"
          fi
          BASE_VERSION="$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')" bash tools/merge-promotion-pr.sh "$pr" "$SHA"

  merge-approved-promotion:
    if: github.repository_owner == 'jeancarlos' && ((github.event_name == 'pull_request' && github.event.pull_request.action != 'closed' && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'develop') || (github.event_name == 'pull_request_review' && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'develop'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: merge after code-owner approval
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CODEOWNER_LOGIN: jeancarlos
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: BASE_VERSION="$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')" bash tools/merge-promotion-pr.sh "$PR_NUMBER" "$SHA"

  publish-promotion-release:
    if: github.repository_owner == 'jeancarlos' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    name: publish promotion release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.merge_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: tag and dispatch the signed release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pull_request }}
          MERGE_SHA: ${{ inputs.merge_sha }}
          CODEOWNER_LOGIN: jeancarlos
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ && "$MERGE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid promotion reference" >&2; exit 1; }
          pr_data="$(gh pr view "$PR_NUMBER" --repo "$GH_REPO" --json state,baseRefName,headRefName,headRefOid,mergeCommit --jq '{state,baseRefName,headRefName,headRefOid,mergeSha:.mergeCommit.oid}')"
          [ "$(jq -r .state <<< "$pr_data")" = MERGED ] || { echo "promotion PR #$PR_NUMBER is not merged" >&2; exit 1; }
          [ "$(jq -r .baseRefName <<< "$pr_data")" = main ] && [ "$(jq -r .headRefName <<< "$pr_data")" = develop ] || { echo "PR #$PR_NUMBER is not develop to main" >&2; exit 1; }
          HEAD_SHA="$(jq -r .headRefOid <<< "$pr_data")"
          [ "$(jq -r .mergeSha <<< "$pr_data")" = "$MERGE_SHA" ] || { echo "merge SHA does not match PR #$PR_NUMBER" >&2; exit 1; }
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid promotion head SHA" >&2; exit 1; }
          reviews="$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER/reviews?per_page=100" --paginate --slurp)"
          review_state="$(jq -r --arg login "$CODEOWNER_LOGIN" --arg sha "$HEAD_SHA" '[.[][] | select(.user.login == $login and .commit_id == $sha and .state != "COMMENTED")] | sort_by(.submitted_at) | last | .state // ""' <<< "$reviews")"
          [ "$review_state" = APPROVED ] || { echo "merged promotion lacks code-owner approval on $HEAD_SHA" >&2; exit 1; }
          version="$(node -e '
          const fs = require("fs");
          const config = fs.readFileSync("config.xml", "utf8");
          const widget = config.match(/<widget\b[^>]*\bversion="([^"]+)"/);
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
          const versions = [widget && widget[1], pkg.version, lock.version, lock.packages && lock.packages[""] && lock.packages[""].version];
          if (versions.some(version => !version) || !versions.every(version => version === versions[0]) || !/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(versions[0])) process.exit(1);
          process.stdout.write(versions[0]);
          ')"
          tag="v$version"
          merge_sha="$MERGE_SHA"
          if tag_ref="$(gh api "repos/$GH_REPO/git/ref/tags/$tag" 2>/dev/null)"; then
            tag_sha="$(printf '%s' "$tag_ref" | jq -r .object.sha)"
            [ "$tag_sha" = "$merge_sha" ] || { echo "tag $tag points to a different commit" >&2; exit 1; }
          else
            gh api --method POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$tag" -f sha="$merge_sha" >/dev/null
          fi
          if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "release $tag already exists"
            exit 0
          fi
          gh workflow run release.yml --ref "$tag" --repo "$GH_REPO"
