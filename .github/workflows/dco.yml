name: dco
on:
  workflow_dispatch:
    inputs:
      base:
        description: Commit to start DCO validation from
        required: false
        type: string
  pull_request:
    branches: [develop]
permissions:
  contents: read
jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: every commit is signed off
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          DISPATCH_BASE: ${{ inputs.base }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            bash tools/check-dco.sh "$PR_BASE" "$PR_HEAD"
          else
            git fetch origin main develop
            base="$DISPATCH_BASE"
            if [ -z "$base" ]; then base="$(git merge-base origin/main HEAD)"; fi
            [[ "$base" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid DCO base SHA" >&2; exit 1; }
            bash tools/check-dco.sh "$base" HEAD
          fi
