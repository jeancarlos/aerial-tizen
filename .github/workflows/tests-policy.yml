name: fixes-have-tests
on:
  pull_request:
    branches: [develop]
permissions:
  contents: read
jobs:
  fixes-have-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: every fix and feat carries a test
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash tools/check-tests.sh "$BASE" "$HEAD"
