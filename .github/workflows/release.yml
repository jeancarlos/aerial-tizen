name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: fuzz settings
        run: npm run fuzz
  release:
    needs: fuzz
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: version matches the tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then bash tools/check-version.sh "$TAG"; else bash tools/check-version.sh; fi
      - name: package and sign
        env:
          TAG: ${{ github.ref_name }}
        run: |
          name="aerial-tizen-${TAG//\//-}"
          git archive --format=zip -0 --prefix="${name}/" -o "${name}.zip" HEAD
          cosign sign-blob --yes --bundle "${name}.zip.sigstore.json" "${name}.zip"
      - name: verify signature
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          name="aerial-tizen-${TAG//\//-}"
          cosign verify-blob --bundle "${name}.zip.sigstore.json" \
            --certificate-identity "https://github.com/${REPO}/.github/workflows/release.yml@${REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${name}.zip"
      - name: publish
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          tools/release-notes.sh "$TAG" > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" "aerial-tizen-${TAG}.zip" "aerial-tizen-${TAG}.zip.sigstore.json" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
