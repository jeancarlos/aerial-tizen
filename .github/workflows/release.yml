name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: package and sign
        env:
          TAG: ${{ github.ref_name }}
        run: |
          name="aerial-tizen-${TAG//\//-}"
          git archive --format=zip --prefix="${name}/" -o "${name}.zip" HEAD
          cosign sign-blob --yes --bundle "${name}.zip.sigstore.json" "${name}.zip"
      - name: verify signature
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          name="aerial-tizen-${TAG//\//-}"
          cosign verify-blob --bundle "${name}.zip.sigstore.json" \
            --certificate-identity-regexp "^https://github.com/${REPO}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${name}.zip"
      - name: publish
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" "aerial-tizen-${TAG}.zip" "aerial-tizen-${TAG}.zip.sigstore.json" --title "$TAG" --generate-notes
