name: ci
on:
  push:
  pull_request:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: syntax
        run: |
          for f in js/*.js demo/*.js test/*.js worker/*.mjs test/*.mjs; do node --check "$f"; done
          for f in *.sh demo/*.sh test/*.sh tools/*.sh; do bash -n "$f"; done
      - run: npm ci --ignore-scripts
      - name: lint
        run: npm run lint
      - name: tests with the 90% coverage gate
        run: npm run coverage
      - name: coverage percent
        run: node -p "require('./coverage/coverage-summary.json').total.lines.pct" > percent.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-percent
          path: percent.txt
      - name: fuzz settings
        run: npm run fuzz
  reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install --require-hashes -r .github/requirements/reuse.txt
      - run: reuse lint
